name: CI/CD Pipeline - Contract & Invoice Leakage Finder

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  GAR_LOCATION: europe-west2
  REPOSITORY: cil-repo
  BACKEND_IMAGE: cil-backend
  FRONTEND_IMAGE: cil-frontend

jobs:
  # Job 1: Quality Assurance & Automated Testing
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-cov

      - name: Run Backend Unit & Tenant Isolation Tests
        run: |
          PYTHONPATH=. pytest backend/app/tests/ -v --cov=backend/app --cov-report=term-missing

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run TypeScript Type Check & Build
        working-directory: ./frontend
        run: npm run build

  # Job 2: Security Vulnerability Scanning
  security-scan:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'

  # Job 3: Build & Push Container Images
  build-and-push:
    needs: security-scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t $BACKEND_IMAGE:${{ github.sha }} ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t $FRONTEND_IMAGE:${{ github.sha }} ./frontend

  # Job 4: Deploy to Staging (Cloud Run)
  deploy-staging:
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy Staging Information
        run: |
          echo "Deploying image version ${{ github.sha }} to Staging Cloud Run (cil-api-staging)..."

  # Job 5: Deploy to Production (Manual Approval Gate Required)
  deploy-production:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Production Deployment Confirmation
        run: |
          echo "Deploying verified image ${{ github.sha }} to Production Cloud Run (cil-api-prod)..."

