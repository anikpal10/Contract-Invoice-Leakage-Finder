version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: leakage_finder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cil-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/leakage_finder
      - ENVIRONMENT=production
      - SECRET_KEY=prod-secret-change-in-production-abcdef0123456789
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - STORAGE_BACKEND=local
      - LOCAL_STORAGE_DIR=/app/backend/storage/uploads
      - LOCAL_EXPORT_DIR=/app/backend/storage/exports
    volumes:
      - ./backend/storage:/app/backend/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cil-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:

